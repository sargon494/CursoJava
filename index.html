<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curso de Java · repaso desde cero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <div class="layout">
    <aside class="barra" aria-label="Navegación del curso">
      <a class="marca" href="#/">Curso de Java</a>
      <nav id="menu"></nav>
      <div class="extras">
        <a href="#/examenes">Exámenes</a>
        <a href="#/referencia">Chuleta</a>
        <a href="#/progreso">Progreso</a>
      </div>
    </aside>
    <main id="contenido" class="principal" tabindex="-1">
      <p id="aviso-progreso" class="aviso-progreso" role="status" hidden></p>
      <div id="app"></div>
      <!-- Contenedores de mejoras UI/UX -->
      <div class="breadcrumbs-container" aria-label="Breadcrumbs"></div>
      <div class="toasts-container" aria-live="polite" aria-atomic="true"></div>
      <div class="badges-container"></div>
      <div class="medalla-container"></div>
      <div class="ayuda-pistas"></div>
      <div class="modo-oscuro-toggle"></div>
      <!-- Modales -->
      <div class="modal-busqueda" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="background:var(--papel);border-radius:12px;padding:1.5rem;max-width:500px;max-height:80vh;overflow:auto;border:1px solid var(--linea);">
          <h3>Búsqueda rápida</h3>
          <input type="search" placeholder="Busca temas, ejercicios, conceptos..." style="width:100%;padding:0.6rem;border:1px solid var(--linea);border-radius:6px;font:inherit;">
          <div style="margin-top:0.8rem;"></div>
          <button type="button" style="width:100%;padding:0.6rem;border-radius:6px;border:1px solid var(--acento);background:var(--acento);color:#fff;font:inherit;cursor:pointer;">Cerrar</button>
        </div>
      </div>
      <div class="modal-examen" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10000;">
        <div class="modal-examen-contenedor" role="dialog" aria-modal="true" style="background:var(--papel);border-radius:12px;padding:1.5rem;max-width:600px;max-height:80vh;overflow:auto;border:1px solid var(--linea);">
          <div class="modal-examen-cabecera" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;border-bottom:1px solid var(--linea);padding-bottom:0.8rem;">
            <h3 style="margin:0;">Examen</h3>
            <button class="modal-examen-cerrar" aria-label="Cerrar" style="background:none;border:none;font-size:1.5rem;line-height:1;cursor:pointer;">×</button>
          </div>
          <div class="modal-examen-cuerpo" style="margin-bottom:1rem;"></div>
          <div class="modal-examen-pie" style="display:flex;justify-content:flex-end;gap:0.5rem;">
            <button class="modal-examen-siguiente" style="padding:0.5rem 1rem;border-radius:6px;border:1px solid var(--acento);background:transparent;color:var(--acento);font:inherit;cursor:pointer;">Siguiente →</button>
          </div>
        </div>
      </div>
      <div class="modal-chuleta" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div class="modal-chuleta-contenedor" style="background:var(--papel);border-radius:12px;padding:1.5rem;max-width:700px;max-height:80vh;overflow:auto;border:1px solid var(--linea);">
          <div class="modal-chuleta-cabecera" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;border-bottom:1px solid var(--linea);padding-bottom:0.8rem;">
            <h3 style="margin:0;">Chuleta</h3>
            <button class="modal-chuleta-cerrar" aria-label="Cerrar" style="background:none;border:none;font-size:1.5rem;line-height:1;cursor:pointer;">×</button>
          </div>
          <div class="modal-chuleta-contenido"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="data.js"></script>
  <script src="contenido/ud01-intro.js"></script>
  <script src="contenido/ud02-condicionales.js"></script>
  <script src="contenido/ud03-bucles.js"></script>
  <script src="contenido/ud04-metodos.js"></script>
  <script src="contenido/ud05-strings.js"></script>
  <script src="contenido/ud06-arrays1d.js"></script>
  <script src="contenido/ud07-arrays2d.js"></script>
  <script src="contenido/ud08-poo.js"></script>
  <script src="contenido/ud09-herencia.js"></script>
  <script src="contenido/ud10-excepciones.js"></script>
  <script src="contenido/ud11-genericos.js"></script>
  <script src="contenido/ud12-colecciones.js"></script>
  <script src="contenido/ud13-funcional.js"></script>
  <script src="contenido/ud14-ficheros.js"></script>
  <script src="contenido/ud15-jdbc.js"></script>
  <script src="contenido/examen-ex-1eval-2025-12-01.js"></script>
  <script src="contenido/examen-ex-2eval-2025-03-10.js"></script>
  <script src="contenido/examen-ex-2eval-2025-03-18.js"></script>
  <script src="contenido/examen-ex-3eval-2025-05-12.js"></script>
  <script src="contenido/examen-ex-3eval-2026-05-25.js"></script>
  <script src="contenido/examen-ex-extraordinaria-2023-06-21.js"></script>
  <!-- Mejoras UI/UX -->
  <script src="mejoras.js"></script>
  <script src="contenido/examen-ex-ordinaria-2025-05-19.js"></script>
  <script src="app.js"></script>
</body>
</html>
